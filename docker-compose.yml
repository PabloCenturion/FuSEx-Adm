services:
  app:
    build: .
    container_name: gestaofinanceira-backend
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

  mysql:
    image: mysql:8.0
    container_name: gestaofinanceira-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gestao_financeira
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  frontend:
    build:
      context: ./frontend/frontend
    container_name: gestaofinanceira-frontend
    ports:
      - "4200:80"
    depends_on:
      - app

volumes:
  mysql_data: